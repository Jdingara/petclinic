name: CI

on:
  push:
    branches: [ master, main, 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ master, main ]

env:
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: build step
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: test step
        run: pytest clinic/ --tb=short
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: lint step
        run: |
          flake8 clinic/ config/ --max-line-length=120 --exclude=migrations
          black --check clinic/ config/ || true

      - name: security/scan step
        run: |
          pip install bandit safety detect-secrets
          bandit -r clinic/ config/ -f json -o bandit-report.json || true
          safety check || true
          detect-secrets scan --baseline .secrets.baseline || true
          coverage run manage.py test clinic
          coverage report --fail-under=60
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: package/container step
        run: docker build -t petclinic:latest . || true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}
          draft: false
          prerelease: false
