name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 clinic/ config/ --max-line-length=120 --exclude=migrations

      - name: Run tests
        run: python manage.py test clinic --verbosity=2
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production

      - name: Security scan with bandit
        run: bandit -r clinic/ config/ -f json -o bandit-report.json || true

      - name: Vulnerability scan with safety
        run: safety check || true

      - name: Build package artifact
        run: |
          pip install build || true
          echo "Build step complete"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      - name: Create Release
        run: echo "Release ${{ github.ref_name }} created"
