name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: build step - install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: test step - run pytest
        run: pytest clinic/ --tb=short
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production

      - name: lint step - flake8 and black
        run: |
          flake8 clinic/ config/ --max-line-length=120 --exclude=migrations
          black --check clinic/ config/ || true

      - name: security/scan step - bandit and safety
        run: |
          bandit -r clinic/ config/ -f json -o bandit-report.json || true
          safety check || true
          coverage run manage.py test clinic
          coverage report --fail-under=60 || true
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production

      - name: package/container step - docker build
        run: docker build -t petclinic:latest . || true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
