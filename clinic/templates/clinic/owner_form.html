{% extends 'clinic/base.html' %}
{% block title %}{{ title }} — PetClinic{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<div class="row mt-4">
    <div class="col-md-6">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Save Owner</button>
            <a href="{% url 'owner_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
