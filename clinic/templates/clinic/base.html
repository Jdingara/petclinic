<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PetClinic{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">🐾 PetClinic</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
            <a class="nav-link text-white" href="{% url 'owner_list' %}">Owners</a>
            {% endif %}
            <a class="nav-link text-white" href="{% url 'vet_list' %}">Veterinarians</a>
            <a class="nav-link text-white" href="/admin/">Admin</a>
        </div>
    </div>
</nav>
<div class="container mt-4 mb-5">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
